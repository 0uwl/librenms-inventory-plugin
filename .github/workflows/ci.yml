name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to a PR makes the first run's result irrelevant, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install tooling
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Yamllint
        # The workflows plus the example inventory sources that ship with this plugin.
        # The examples end in .yml.dist, so they have to be named rather than globbed
        # by extension.
        run: uv run yamllint .github/workflows examples/*.yml.dist

  docs:
    name: Plugin documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install ansible-core
        run: uv sync --locked --no-dev

      # A malformed DOCUMENTATION or EXAMPLES block breaks `ansible-doc` for users and
      # can stop Ansible registering the plugin's options at all, which the unit tests
      # would report as a confusing option error rather than a docs problem.
      - name: DOCUMENTATION and EXAMPLES are valid YAML
        run: |
          uv run python - <<'PY'
          import yaml
          from ansible.plugins.loader import inventory_loader

          inventory_loader.add_directory("inventory_plugins")
          plugin = inventory_loader.get("librenms")
          module = __import__(type(plugin).__module__, fromlist=["*"])

          for block in ("DOCUMENTATION", "EXAMPLES"):
              yaml.safe_load(getattr(module, block))
              print(f"{block}: ok")
          PY

      - name: ansible-doc renders the plugin
        env:
          ANSIBLE_INVENTORY_PLUGINS: ./inventory_plugins
        run: uv run ansible-doc -t inventory librenms

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ansible-core 2.19+ requires Python 3.12 or newer on the controller.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install ansible-core
        run: uv sync --locked --no-dev

      # Only the unit tests run here. tests/integration needs a reachable LibreNMS
      # instance and skips itself without one, so running it would prove nothing.
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests/unit -v

  ci:
    name: CI
    runs-on: ubuntu-latest
    # Aggregates the jobs above so branch protection needs a single required check
    # rather than one entry per matrix leg.
    needs: [lint, docs, test]
    if: always()
    steps:
      - name: Check that every job passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi
          echo "All jobs passed."
