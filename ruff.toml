# Lint configuration for the librenms inventory plugin. Run locally with:
#   ruff check .
# CI runs the same command, so a clean local run means a clean CI run.

line-length = 120
target-version = "py312"  # ansible-core 2.19+ requires Python 3.12 on the controller

exclude = [".venv", ".git"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: outdated syntax
    "C4",   # comprehension clean-ups
    "SIM",  # simplifiable constructs
]

[lint.per-file-ignores]
# A plugin module must define DOCUMENTATION/EXAMPLES before its imports.
"inventory_plugins/*.py" = ["E402"]

# Test scaffolding. The temp-file helpers deliberately outlive the block that opens
# them, with cleanup registered through addCleanup instead of a context manager.
"tests/*.py" = ["SIM105", "SIM108", "SIM115"]
